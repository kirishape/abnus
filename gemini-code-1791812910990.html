<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامه‌ریزی تولید آبنوس - نسخه ابری</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1f2;--card:#fff;--ink:#14191c;--mut:#667078;--line:#dce2e5;--ac:#0e7c7b;--onac:#fff;--acs:#e3f1f0;--ok:#2b8a57;--warn:#b7791f;--bad:#c53030;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101416;--card:#181e21;--ink:#e6eaec;--mut:#8f9aa1;--line:#283136;--ac:#4fd1c5;--onac:#06201e;--acs:#143230;--ok:#68d391;--warn:#f6ad55;--bad:#fc8181}}
:root[data-theme="dark"]{--bg:#101416;--card:#181e21;--ink:#e6eaec;--mut:#8f9aa1;--line:#283136;--ac:#4fd1c5;--onac:#06201e;--acs:#143230;--ok:#68d391;--warn:#f6ad55;--bad:#fc8181}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 Vazirmatn,Tahoma,sans-serif}
.w{max-width:1100px;margin:auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0;line-height:1.4}h1 small{display:block;color:var(--mut);font-size:12px;font-weight:400}
h2{font-size:15px;margin:0 0 10px}
.hr{display:flex;gap:8px;align-items:center}.hr select{width:auto}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;margin-bottom:16px}
nav button{border:0;background:none;color:var(--mut);font:inherit;padding:6px 16px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--onac)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.cd:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.g{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:2fr 1fr}
.kv b{display:block;font-size:22px;line-height:1.4}.kv span{color:var(--mut);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:500;text-align:right;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr[data-a]{cursor:pointer}tr[data-a]:hover{background:var(--acs)}
.sub{color:var(--mut);font-size:12px}
.chip{display:inline-block;padding:0 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor}.chip.ac{color:var(--ac);border-color:currentColor}.chip.warn{color:var(--warn);border-color:currentColor}.chip.bad{color:var(--bad);border-color:currentColor}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:10px;cursor:pointer}
.btn.p{background:var(--ac);color:var(--onac);border-color:var(--ac)}.btn.d{color:var(--bad)}.btn.on{border-color:var(--bad);color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;width:100%}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.f label{font-size:12px;color:var(--mut);display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:10px}.bar input,.bar select{width:auto}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(580px,94vw);padding:18px}dialog::backdrop{background:#0008}
.ch{display:flex;align-items:flex-end;gap:3px;height:160px}.ch i{flex:1;border-radius:4px 4px 0 0;background:var(--ac);min-height:3px}
.ch i.w{background:var(--warn)}.ch i.x{background:var(--bad)}.ch i.off{background:var(--line)}
.lb{display:flex;gap:3px;font-size:10px;color:var(--mut);margin-top:4px}.lb span{flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal>.h{text-align:center;color:var(--mut);font-size:12px}
.cd{border:1px solid var(--line);border-radius:10px;padding:6px;min-height:78px;background:var(--card);cursor:pointer;font-size:12px}
.cd.off{background:transparent;opacity:.55}.cd.sel{outline:2px solid var(--ac)}
.pb{height:5px;border-radius:9px;background:var(--line);margin:5px 0;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}.pb i.w{background:var(--warn)}.pb i.x{background:var(--bad)}
.it{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}.it:last-child{border:0}
.it.dn{opacity:.45;text-decoration:line-through}.it input{width:auto;margin-top:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999}
.auth-box{background:var(--card);padding:24px;border-radius:16px;width:min(380px,90vw);border:1px solid var(--line)}
@media(max-width:760px){.two{grid-template-columns:1fr}}
@media(max-width:600px){.hs{display:none}.cd{min-height:58px;padding:4px}.w{padding:12px}}
</style>
</head>
<body>

<!-- پنل احراز هویت ادمین -->
<div id="auth-overlay">
  <div class="auth-box">
    <h2>ورود به پنل مدیریت آبنوس</h2>
    <p class="sub" style="margin-bottom:14px">لطفاً برای دسترسی به سیستم کد کاربری (`admin`) و رمز عبور (`123456`) را وارد کنید.</p>
    <div class="f" style="grid-template-columns:1fr; gap:12px">
      <div><label>کد کاربری</label><input type="text" id="admin-user" value="admin"></div>
      <div><label>رمز عبور</label><input type="password" id="admin-pass" value="123456"></div>
    </div>
    <button class="btn p" id="login-btn" style="width:100%; margin-top:16px">ورود به سیستم</button>
    <p id="login-err" class="sub" style="color:var(--bad); margin-top:8px; text-align:center; display:none">کد کاربری یا رمز عبور اشتباه است.</p>
  </div>
</div>

<div class="w" id="app-content" style="display:none">
<header>
<h1>برنامه‌ریزی تولید شیشه<small>شرکت آبنوس (سرور ابری کلودفلر)</small></h1>
<div class="hr">
  <span class="chip" id="st">کلودفلر آماده</span>
  <span class="sub">امروز</span>
  <select id="tod" data-s="today" aria-label="تاریخ امروز"></select>
  <button class="btn" data-a="bk">پشتیبان‌گیری اسناد</button>
  <button class="btn d" data-a="logout">خروج</button>
</div>
</header>
<nav>
<button data-a="tab" data-v="dash">داشبورد</button>
<button data-a="tab" data-v="inv">فاکتورها و اسناد</button>
<button data-a="tab" data-v="cal">تقویم تولید</button>
<button data-a="tab" data-v="fm">فورس‌ماژور</button>
<button data-a="tab" data-v="tod">گزارش روز</button>
<button data-a="tab" data-v="set">تنظیمات</button>
</nav>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const loginBtn = document.getElementById('login-btn');
  if (loginBtn) {
    loginBtn.addEventListener('click', () => {
      const u = document.getElementById('admin-user').value.trim();
      const p = document.getElementById('admin-pass').value.trim();
      if(u === 'admin' && p === '123456') {
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('app-content').style.display = 'block';
        initApp();
      } else {
        document.getElementById('login-err').style.display = 'block';
      }
    });
  }
});

const WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const GL={'سکوریت':'SO','لمینت':'L','دوجداره':'D','سندبلاست':'SN','اجرتی':'OJ','ساده':'SA','سایر':'DY'};
const PR=['بحرانی','فوری','عادی'],ST=['در صف','در حال تولید','تکمیل شده','لغو شده'],PC={'بحرانی':'bad','فوری':'warn','عادی':''},SC={'تکمیل شده':'ok','در حال تولید':'ac'};
const KL={own:'برنامه امروز',carry:'ادامه از قبل',pull:'پر از فردا'};
const KEY='abnus-cloud-planner-v2';
const SEED={set:{year:1405,month:8,days:30,cap:150,half:75,res:4,first:'پنجشنبه',blackout:'خیر',today:'1405/08/11',hol:[],sat:[]},seq:6,done:{},
inv:[
{id:1,customer:'آقای محمدی',project:'ویلای شمال نما',date:'1405/08/01',glass:'سکوریت',mil:10,area:45,pri:'عادی',st:'در حال تولید',dims:'۲۲۰×۳۰۰ دوجداره برنز',phone:'09121234567'},
{id:2,customer:'شرکت پاسارگاد',project:'برج پاسداران فاز۲',date:'1405/08/02',glass:'لمینت',mil:12,area:120,pri:'فوری',st:'در صف',dims:'نمای شیشه‌ای طبق نقشه',phone:'09129876543'},
{id:3,customer:'خانم رضایی',project:'آپارتمان تهرانپارس',date:'1405/08/03',glass:'ساده',mil:6,area:28,pri:'عادی',st:'در صف',dims:'پنجره ۱۲۰×۱۵۰ تعداد ۱۲'},
{id:4,customer:'آقای کریمی',project:'سوله صنعتی',date:'1405/08/04',glass:'سکوریت',mil:10,area:160,pri:'عادی',st:'در صف',dims:'سوله - بخش اول ۱۰۰ م²'},
{id:5,customer:'آقای کریمی',project:'سوله صنعتی (سرریز)',date:'1405/08/04',glass:'سکوریت',mil:10,area:60,pri:'عادی',st:'در صف',dims:'سوله - بخش دوم ۶۰ م²',base:'1405-4-SO'}],
fm:[{id:1,who:'آقای وطن‌خواه',date:'1405/08/11',area:5,glass:'ساده',reason:'سفارش فوری مشتری VIP',pri:'فوری',st:'در صف'}]};

const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const fa=s=>String(s).replace(/\d/g,x=>'۰۱۲۳۴۵۶۷۸۹'[x]),f=n=>fa((+n||0).toLocaleString('en',{maximumFractionDigits:1}));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=structuredClone(SEED),C,tab='dash',selDay=null,q='',fs='',lateOnly=false,RO=false,ready=false;

function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    $('#st').textContent = 'ذخیره ابری (کلودفلر)';
  } catch(e) {
    $('#st').textContent = 'خطا در ذخیره';
  }
}

function loadCloudData() {
  try {
    const data = localStorage.getItem(KEY);
    if(data) {
      S = JSON.parse(data);
    }
  } catch(e) {}
  ready = true;
  render();
}

function calc(){
 const s=S.set,fi=WD.indexOf(s.first),ds=[];
 for(let d=1;d<=s.days;d++){
  const date=`${s.year}/${p2(s.month)}/${p2(d)}`,wd=WD[(fi+d-1)%7];let t='کامل';
  if(s.hol.includes(date)||wd=='جمعه'||(wd=='شنبه'&&s.blackout=='بله'&&s.sat.includes(date)))t='تعطیل';
  else if(wd=='پنجشنبه'&&s.blackout=='خیر')t='نصف';
  const E=t=='تعطیل'?0:t=='نصف'?s.half:s.cap,F=t=='تعطیل'?0:t=='نصف'?Math.round(s.res/2):s.res;
  const fmv=S.fm.filter(x=>x.date==date&&x.st!='لغو').reduce((a,x)=>a+ +x.area,0);
  ds.push({d,date,wd,t,E,F,fm:fmv,use:Math.max(0,E-F-Math.max(0,fmv-F)),al:[],load:0});
 }
 const wk=ds.filter(x=>x.t!='تعطیل'),map=Object.fromEntries(ds.map(x=>[x.date,x])),grp={};
 const rows=S.inv.map(i=>({...i}));
 rows.forEach(r=>{
  r.code=r.base?r.base+'-R':`${s.year}-${r.id}-${GL[r.glass]||'DY'}`;
  const nx=wk.filter(x=>x.date>=r.date),[a,b,c]=nx;
  r.del=((nx[6]||wk[6])||{}).date||'';r.auto='';
  if(a&&r.st!='لغو شده'){grp[a.date]=(grp[a.date]||0)+ +r.area;const c1=a.use,c2=c1+(b?b.use:0);
   r.auto=grp[a.date]<=c1?a.date:b?(grp[a.date]<=c2?b.date:(c?c.date:b.date)):a.date}
  r.eff=r.over||r.auto;
  if(r.eff){const x=wk.find(w=>w.date>=r.eff);r.eff=x?x.date:''}
  r.late=!r.dl&&r.st!='لغو شده'&&!!r.del&&s.today>r.del;
  r.lateDays=r.late&&s.today.slice(0,7)==r.del.slice(0,7)?+s.today.slice(8)-+r.del.slice(8):null;
  r.rem=+r.area;r.segs=[];
 });
 const act=rows.filter(r=>r.st!='لغو شده'&&r.eff);
 wk.forEach((day,i)=>{
  let room=day.use;
  const take=(r,kind)=>{const n=Math.min(r.rem,room);if(n>0){r.rem-=n;room-=n;day.load+=n;day.al.push({r,q:n,kind});r.segs.push(day.date)}};
  act.filter(r=>r.eff<day.date&&r.rem>0).forEach(r=>take(r,'carry'));
  act.filter(r=>r.eff==day.date&&r.rem>0).forEach(r=>take(r,'own'));
  const nxt=wk[i+1];if(nxt&&room>0)act.filter(r=>r.eff==nxt.date&&r.rem>0).forEach(r=>take(r,'pull'));
 });
 rows.forEach(r=>{r.start=r.segs[0];r.end=r.segs[r.segs.length-1];r.split=r.segs.length>1;r.spill=r.eff?r.rem:0});
 return{ds,rows,map};
}

const kv=(l,v,c='')=>`<div class="card kv"><b class="${c}" ${c?'style="color:var(--'+c+')"':''}>${v}</b><span>${l}</span></div>`;
const dateOpts=()=>C.ds.map(d=>[d.date,`${fa(d.date.slice(5))} ${d.wd}`]);
const chip=(t,c='')=>`<span class="chip ${c}">${esc(t)}</span>`;
const sf=(k,l,o)=>`<div><label>${l}</label>${o?`<select data-s="${k}">${o.map(x=>`<option ${x==S.set[k]?'selected':''}>${x}</option>`).join('')}</select>`:`<input data-s="${k}" type="number" value="${S.set[k]}">`}</div>`;
const lst=(k,t)=>`<div class="card"><h2>${t}</h2><div class="bar" style="justify-content:flex-start"><select id="hs${k}">${dateOpts().map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><button class="btn" data-a="addH" data-v="${k}">افزودن</button></div><div class="tags">${S.set[k].map(d=>`<span class="chip">${fa(d.slice(5))} <a data-a="delH" data-v="${k}\vert{}${d}" style="cursor:pointer;color:var(--bad)" role="button" aria-label="حذف">×</a></span>`).join('')||'<span class="sub">موردی ثبت نشده</span>'}</div></div>`;

const V={
dash:C=>{const s=S.set,act=C.rows.filter(r=>r.st!='لغو شده'),late=act.filter(r=>r.late);
 const bars=C.ds.map(d=>{const p=d.E?(d.load+d.fm)/d.E:0;return `<i class="${!d.E?'off':p>1?'x':p>.85?'w':''}" style="height:${d.E?Math.max(2,Math.min(100,p*100)):12}%" title="${fa(d.date)}: ${f(d.load+d.fm)} / ${f(d.E)}"></i>`}).join('');
 return `<div class="g k">${kv('ظرفیت اسمی روزانه (م²)',f(s.cap))}${kv('رزرو اضطراری روزانه (م²)',f(s.res))}${kv('ظرفیت قابل برنامه‌ریزی (م²)',f(s.cap-s.res))}${kv('ظرفیت نصف‌روز (م²)',f(s.half))}${kv('مجموع متراژ ثبت‌شده (م²)',f(act.reduce((a,r)=>a+ +r.area,0)))}${kv('تعداد فاکتورها',f(act.length))}${kv('قطعی برق',s.blackout)}${kv('پروژه‌های دیرکرددار',f(late.length),late.length?'bad':'')}</div>
 <div class="g two" style="margin-top:12px"><div class="card"><h2>بار تولید اسناد ${fa(s.year)}/${fa(p2(s.month))}</h2><div class="ch">${bars}</div><div class="lb">${C.ds.map(d=>`<span>${fa(d.d)}</span>`).join('')}</div><p class="sub" style="margin:10px 0 0">آبی‌سبز: عادی · زرد: بالای ۸۵٪ · قرمز: اضافه‌بار · خاکستری: تعطیل</p></div>
 <div class="card"><h2>دیرکرد اسناد</h2>${late.map(r=>`<div class="it" data-a="editInv" data-v="${r.id}"><div style="flex:1"><b>${esc(r.code)}</b><div class="sub">${esc(r.customer)} · ${esc(r.project)}</div></div>${chip(r.lateDays!=null?f(r.lateDays)+' روز':'دارد','bad')}</div>`).join('')||'<span class="sub">پروژه‌ای دیرکرد ندارد.</span>'}</div></div>`},

inv:C=>{const L=C.rows.filter(r=>(!fs||r.st==fs)&&(!lateOnly||r.late)&&(!q||[r.code,r.customer,r.project,r.phone].join(' ').includes(q)));
 return `<div class="card"><div class="bar"><div class="hr"><input data-q="" value="${esc(q)}" placeholder="جستجوی مشتری، پروژه یا کد" aria-label="جستجو"><select data-f="" aria-label="وضعیت"><option value="">همه وضعیت‌ها</option>${ST.map(x=>`<option ${x==fs?'selected':''}>${x}</option>`).join('')}</select><button class="btn ${lateOnly?'on':''}" data-a="late">فقط دیرکرد</button></div><button class="btn p" data-a="newInv">+ سند فاکتور جدید</button></div>
 <div class="tw"><table><tr><th>کد سند<th>مشتری / پروژه<th>تاریخ ثبت<th>نوع<th>متراژ<th>تولید<th>تحویل<th>اولویت<th>وضعیت<th>دیرکرد</tr>
 ${L.map(r=>`<tr data-a="editInv" data-v="${r.id}"><td>${esc(r.code)}<td><b>${esc(r.customer)}</b><div class="sub">${esc(r.project)}</div><td>${fa(r.date.slice(5))}<td>${esc(r.glass)}${fa(r.mil)}<td>${f(r.area)}<td>${r.start?fa(r.start.slice(5))+(r.split?' ← '+fa(r.end.slice(5)):'')+(r.spill?' '+chip('خارج ماه','warn'):''):'—'}<td>${r.del?fa(r.del.slice(5)):'—'}<td>${chip(r.pri,PC[r.pri])}<td>${chip(r.st+(r.dl?' · تحویل شد':''),SC[r.st]\vert{}\vert{}'')}<td>${r.late?chip(r.lateDays!=null?f(r.lateDays)+' روز':'دارد','bad'):'—'}</tr>`).join('')||'<tr><td colspan="10" class="sub">سندی پیدا نشد.</tr>'}</table></div>
 <p class="sub" style="margin:10px 0 0">گزارشات و تقویم تولید به صورت سند در سیستم ابری ذخیره و در دسترس می‌باشند.</p></div>`},

cal:C=>{const fi=WD.indexOf(S.set.first),d0=selDay&&C.ds[selDay-1];
 let h=WD.map(w=>`<div class="h">${w}</div>`).join('')+'<div></div>'.repeat(fi);
 C.ds.forEach(d=>{const p=d.E?(d.load+d.fm)/d.E:0;h+=`<div class="cd ${d.E?'':'off'} ${selDay==d.d?'sel':''}" tabindex="0" data-a="day" data-v="${d.d}"><b>${fa(d.d)}</b> <span class="chip hs">${d.t}</span><div class="pb"><i class="${p>1?'x':p>.85?'w':''}" style="width:${Math.min(100,p*100)}%"></i></div>${d.E?f(d.load+d.fm)+'/'+f(d.E):''}</div>`});
 let det='';
 if(d0){const fms=S.fm.filter(x=>x.date==d0.date&&x.st!='لغو');
  det=`<div class="card" style="margin-top:12px"><h2>${fa(d0.date)} — ${d0.wd} (${d0.t}) · سند روزانه تولید</h2>${fms.map(x=>`<div class="it" style="cursor:default"><div style="flex:1"><b>FM-${fa(x.id)}</b>${esc(x.reason)}</div><b>${f(x.area)} م²</b> ${chip('فورس‌ماژور','warn')}</div>`).join('')}${d0.al.map(a=>`<div class="it" data-a="editInv" data-v="${a.r.id}"><div style="flex:1"><b>${esc(a.r.code)}</b>${esc(a.r.project)}<div class="sub">${esc(a.r.customer)}</div></div><b>${f(a.q)} م²</b> ${chip(KL[a.kind])}</div>`).join('')||(fms.length?'':'<span class="sub">سندی برای این روز ثبت نشده است.</span>')}</div>`}
 return `<div class="card"><div class="cal">${h}</div></div>${det}`},

fm:C=>`<div class="card"><div class="bar"><h2 style="margin:0">اسناد فورس‌ماژور و سفارشی</h2><button class="btn p" data-a="newFm">+ ثبت سند فوری</button></div><div class="tw"><table><tr><th>کد سند<th>درخواست‌کننده<th>تاریخ<th>متراژ<th>نوع<th>دلیل<th>اولویت<th>وضعیت</tr>${S.fm.map(x=>`<tr data-a="editFm" data-v="${x.id}"><td>FM-${fa(x.id)}<td>${esc(x.who)}<td>${fa(x.date.slice(5))}<td>${f(x.area)}<td>${esc(x.glass)}<td>${esc(x.reason)}<td>${chip(x.pri,'warn')}<td>${esc(x.st)}</tr>`).join('')||'<tr><td colspan="8" class="sub">سندی ثبت نشده.</tr>'}</table></div></div>`,

tod:C=>{const d=C.map[S.set.today];if(!d)return '<div class="card">تاریخ امروز در ماه جاری نیست.</div>';
 const fms=S.fm.filter(x=>x.date==d.date&&x.st!='لغو');
 const row=(key,code,title,sub,n)=>{const dn=S.done[key];return `<div class="it ${dn?'dn':''}" data-a="done" data-v="${key}"><input type="checkbox" tabindex="-1" ${dn?'checked':''}><div style="flex:1"><b>${esc(code)}</b> ${esc(title)}<div class="sub">${esc(sub)}</div></div><b>${f(n)} م²</b></div>`};
 const sec=(t,it)=>`<div class="card"><h2>${t} ${chip(f(it.length))}</h2>${it.join('')||'<span class="sub">موردی نیست</span>'}</div>`;
 const al=k=>d.al.filter(a=>a.kind==k).map(a=>row(a.r.id+':'+d.date,a.r.code,a.r.project,[a.r.customer,a.r.dims].filter(Boolean).join(' — ')+(k=='pull'?` | کل ${f(a.r.area)} م²`:''),a.q));
 return `<div class="g k" style="margin-bottom:12px">${kv('وضعیت روز',d.t)}${kv('ظرفیت قابل استفاده',f(d.use)+' م²')}${kv('برنامه امروز',f(d.load)+' م²')}${kv('فورس‌ماژور',f(d.fm)+' م²')}</div>
 <div class="g">${sec('اولویت ۱ — فورس‌ماژور',fms.map(x=>row('fm'+x.id+':'+d.date,'FM-'+fa(x.id),x.reason,x.who+' · '+x.glass,x.area)))}${sec('اولویت ۲ — روز کاری بعد',al('pull'))}${sec('اولویت ۳ — روز قبل',al('carry'))}${sec('اولویت ۴ — پروژه‌های جدید',al('own'))}</div>`},

set:C=>`<div class="card"><h2>پارامترهای اسناد تولید</h2><div class="f">${sf('year','سال شمسی')}${sf('month','ماه (۱ تا ۱۲)')}${sf('days','تعداد روزهای ماه')}${sf('first','روز هفته‌ی اول ماه',WD)}${sf('cap','ظرفیت اسمی روزانه (م²)')}${sf('half','ظرفیت نصف‌روز (م²)')}${sf('res','رزرو اضطراری روزانه (م²)')}${sf('blackout','قطعی برق این ماه؟',['خیر','بله'])}</div></div>
 <div class="g" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:12px">${lst('hol','تعطیلات رسمی این ماه')}${lst('sat','شنبه‌های تعطیل')}</div>
 <p style="margin-top:14px"><button class="btn d" data-a="reset">بازنشانی اسناد به حالت اولیه</button></p>`
};

function form(title,F,v,ok,del){
 const d=$('#dlg');
 d.innerHTML=`<h2>${title}</h2><div class="f">${F.map(([k,l,t,o])=>`<div><label>${l}</label>${t=='sel'?`<select name="${k}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}" ${a==v[k]?'selected':''}>${esc(b)}</option>`}).join('')}</select>`:t=='chk'?`<select name="${k}"><option value="">خیر</option><option value="1" ${v[k]?'selected':''}>بله</option></select>`:`<input name="${k}" type="${t=='num'?'number':'text'}" step="any" value="${esc(v[k])}">`}</div>`).join('')}</div><div class="bar" style="margin:14px 0 0;justify-content:flex-start"><button class="btn p" id="ok">ذخیره سند</button><button class="btn" id="cx">انصراف</button>${del?'<button class="btn d" id="dl" style="margin-inline-start:auto">حذف سند</button>':''}</div>`;
 d.showModal();$('#cx').onclick=()=>d.close();
 $('#ok').onclick=()=>{const o={};d.querySelectorAll('[name]').forEach(e=>o[e.name]=e.value);ok(o);d.close();save();render()};
 if(del)$('#dl').onclick=()=>{if(confirm('این سند حذف شود؟')){del();d.close();save();render()}};
}
function editInv(id){
 const cur=S.inv.find(x=>x.id==id)||{date:C.ds[0].date,glass:'سکوریت',mil:10,pri:'عادی',st:'در صف',area:''};
 form(id?'ویرایش سند فاکتور':'سند فاکتور جدید',[['customer','نام مشتری','text'],['project','نام / شرح پروژه','text'],['date','تاریخ فاکتور','sel',dateOpts()],['glass','نوع شیشه','sel',Object.keys(GL)],['mil','میل','sel',[4,6,8,10,12,15,19]],['area','متراژ (م²)','num'],['pri','اولویت','sel',PR],['st','وضعیت','sel',ST],['over','تاریخ تولید','sel',[['','خودکار'],...dateOpts()]],['dl','تحویل شد؟','chk'],['phone','تلفن','text'],['dims','ابعاد و توضیحات','text']],cur,o=>{
  o.area=+o.area||0;o.mil=+o.mil;o.project=o.project||'بدون نام';
  if(id)Object.assign(S.inv.find(x=>x.id==id)||cur,o);else S.inv.push({id:S.seq++,...o});
 },id?()=>{S.inv=S.inv.filter(x=>x.id!=id)}:null);
}
function editFm(id){
 const cur=S.fm.find(x=>x.id==id)||{who:'آقای وطن‌خواه',date:S.set.today,glass:'ساده',pri:'فوری',st:'در صف',area:''};
 form(id?'ویرایش سند فوری':'ثبت سند فوری',[['who','درخواست‌کننده','sel',['آقای وطن‌خواه','مهندس اسکندری','شیشه شکسته','خط تولید','سایر']],['date','تاریخ تولید','sel',dateOpts()],['area','متراژ (م²)','num'],['glass','نوع شیشه','sel',Object.keys(GL)],['reason','دلیل','text'],['pri','اولویت','sel',['فوری','اضطراری','شکست خط']],['st','وضعیت','sel',['در صف','در حال تولید','تحویل شد','لغو']],['note','یادداشت','text']],cur,o=>{
  o.area=+o.area||0;
  if(id)Object.assign(S.fm.find(x=>x.id==id)||cur,o);else S.fm.push({id:S.fm.reduce((m,x)=>Math.max(m,x.id),0)+1,...o});
 },id?()=>{S.fm=S.fm.filter(x=>x.id!=id)}:null);
}
function backup(){
 const d=$('#dlg');
 d.innerHTML=`<h2>پشتیبان‌گیری اسناد ابری</h2><p class="sub" style="margin:0 0 8px">متن زیر شامل تمام اسناد ثبت‌شده است. می‌توانید آن را کپی یا بازیابی کنید.</p><textarea id="bt" rows="9" dir="ltr">${esc(JSON.stringify(S))}</textarea><div class="bar" style="margin:12px 0 0;justify-content:flex-start"><button class="btn p" id="ok">بازیابی اسناد</button><button class="btn" id="cx">بستن</button></div>`;
 d.showModal();$('#cx').onclick=()=>d.close();
 $('#ok').onclick=()=>{try{const o=JSON.parse($('#bt').value);if(!o.set||!o.inv)throw 0;S=Object.assign({fm:[],done:{},seq:1},o);d.close();save();render()}catch(e){alert('متن معتبر نیست.')}};
}

const A={
 tab:v=>{tab=v;selDay=null},newInv:()=>editInv(),editInv:v=>editInv(+v),newFm:()=>editFm(),editFm:v=>editFm(+v),
 day:v=>{selDay=selDay==v?null:+v},late:()=>{lateOnly=!lateOnly},done:v=>{S.done[v]=!S.done[v]},bk:()=>backup(),
 addH:v=>{const d=$('#hs'+v).value;if(d&&!S.set[v].includes(d))S.set[v].push(d)},
 delH:v=>{const[k,d]=v.split('|');S.set[k]=S.set[k].filter(x=>x!=d)},
 reset:()=>{if(confirm('تمام اسناد حذف و با داده‌های اولیه جایگزین می‌شود؟'))S=structuredClone(SEED)},
 logout:()=>{document.getElementById('auth-overlay').style.display = 'flex';document.getElementById('app-content').style.display = 'none';}
};

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]'),n=t&&t.dataset.a;if(!n||!A[n])return;A[n](t.dataset.v);save();render()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches('.cd')){e.target.click()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.s){S.set[t.dataset.s]=t.type=='number'?+t.value:t.value;save();render()}
 else if(t.dataset.f!=null){fs=t.value;render()}});
document.addEventListener('input',e=>{if(e.target.dataset.q!=null){q=e.target.value;render();const i=$('[data-q]');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});

function render(){
 if(!ready)return;C=calc();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==tab));
 $('#tod').innerHTML=C.ds.map(d=>`<option value="${d.date}" ${d.date==S.set.today?'selected':''}>${fa(d.date)} ${d.wd}</option>`).join('');
 $('#main').innerHTML=V[tab](C);
}

function initApp(){
 loadCloudData();
}
</script>
</body>
</html>
